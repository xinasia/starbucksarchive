<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little Corner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000000;
  color: #decdbf;
  font-family: Arial, sans-serif;
}

/* MAIN SECTIONS */

.social-section,
.spotify-section {
  width: 100%;
  padding: 35px 20px;
}

.section-label {
  text-align: center;
  font-size: 9px;
  letter-spacing: 4px;
  color: #decdbf;
  margin-bottom: 25px;
}

/* MIDNIGHT NEWS */

.midnight-feature {
  max-width: 850px;
  margin: 0 auto 25px;
  padding: 17px 25px;
  background: #0b0b0b;
  border: 1px solid rgba(222,205,191,.45);
  text-align: center;
  transition: .3s ease;
}

.midnight-feature:hover {
  border-color: #decdbf;
  box-shadow: 0 10px 35px rgba(222,205,191,.07);
}

.midnight-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 8px;
  letter-spacing: 2px;
  color: #decdbf;
  opacity: .7;
  margin-bottom: 12px;
}

.midnight-feature h2 {
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: clamp(27px, 5vw, 42px);
  letter-spacing: 3px;
  margin: 8px 0 5px;
  color: #decdbf;
}

.midnight-tagline {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 14px;
  margin: 5px 0 8px;
  color: #decdbf;
}

.midnight-status {
  font-size: 8px;
  letter-spacing: 3px;
  color: #decdbf;
  margin: 8px 0;
}

.midnight-divider {
  width: 45px;
  height: 1px;
  background: #decdbf;
  opacity: .5;
  margin: 12px auto;
}

.midnight-button {
  display: inline-block;
  padding: 10px 20px;
  border: 1px solid #decdbf;
  color: #decdbf;
  text-decoration: none;
  font-size: 9px;
  letter-spacing: 2px;
  margin: 5px 0 8px;
  transition: .3s ease;
}

.midnight-button:hover {
  background: #decdbf;
  color: #000000;
}

.midnight-footer {
  font-size: 8px;
  letter-spacing: 2px;
  opacity: .6;
  margin-top: 8px;
}

/* SOCIAL LINKS */

.social-links {
  max-width: 850px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.social-link {
  display: block;
  width: 100%;
  padding: 15px 20px;
  background: #0b0b0b;
  border: 1px solid rgba(222,205,191,.35);
  color: #decdbf;
  text-decoration: none;
  text-align: center;
  font-size: 10px;
  letter-spacing: 3px;
  transition: .3s ease;
}

.social-link:hover {
  border-color: #decdbf;
  background: #111111;
}

/* SPOTIFY SECTION */

.spotify-section {
  padding-top: 40px;
  padding-bottom: 100px;
}

.spotify-heading {
  text-align: center;
  margin: 0 auto 45px;
}

.eyebrow {
  font-size: 9px;
  letter-spacing: 4px;
  color: #decdbf;
  opacity: .8;
}

.spotify-heading h2 {
  font-family: Georgia, serif;
  font-size: clamp(38px, 7vw, 60px);
  font-weight: 400;
  margin: 18px 0 12px;
  color: #decdbf;
}

.spotify-heading p {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 15px;
  color: #decdbf;
  opacity: .75;
}

.spotify-frame {
  max-width: 750px;
  margin: auto;
  padding: 20px;
  border: 1px solid rgba(222,205,191,.5);
  background: #0b0b0b;
  box-shadow: 0 15px 50px rgba(222,205,191,.05);
  transition: .4s ease;
}

.spotify-frame:hover {
  border-color: #decdbf;
  box-shadow: 0 15px 55px rgba(222,205,191,.1);
}

.spotify-top {
  display: flex;
  justify-content: space-between;
  padding: 5px 3px 18px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #decdbf;
}

.spotify-frame iframe {
  display: block;
  width: 100%;
  border-radius: 8px;
}

/* MOBILE */

@media (max-width: 600px) {
  .social-section {
    padding: 25px 14px;
  }

  .midnight-feature {
    padding: 15px 13px;
  }

  .midnight-top {
    font-size: 7px;
    letter-spacing: 1px;
  }

  .midnight-feature h2 {
    letter-spacing: 2px;
  }

  .spotify-frame {
    padding: 12px;
  }

  .spotify-top {
    font-size: 8px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>
</head>

<body>

<!-- MIDNIGHT.NEWS AND SOCIAL LINKS -->

<section class="social-section">

  <div class="section-label">✦ &nbsp; MY LITTLE CORNER &nbsp; ✦</div>

  <div class="midnight-feature">

    <div class="midnight-top">
      <span>INDEPENDENT DIGITAL MAGAZINE</span>
      <span>NOW LIVE ✦</span>
    </div>

    <h2>MIDNIGHT.NEWS</h2>

    <p class="midnight-tagline">Every hour has a story.</p>

    <div class="midnight-divider"></div>

    <a
      class="midnight-button"
      href="https://xinasia.github.io/MIDNIGHT.NEWS/"
      target="_blank"
      rel="noopener noreferrer"
    >
      EXPLORE THE PUBLICATION ↗
    </a>

    <div class="midnight-footer">
      MIDNIGHT.NEWS · THE DAILY EDITION
    </div>

  </div>

  <div class="social-links">

    <a
      class="social-link"
      href="https://pinterest.com/chrisxy_xin/_profile/"
      target="_blank"
      rel="noopener noreferrer"
    >
      PINTEREST ↗
    </a>

    <a
      class="social-link"
      href="https://www.tiktok.com/@chrisxy.xin"
      target="_blank"
      rel="noopener noreferrer"
    >
      TIKTOK ↗
    </a>

  </div>

</section>

<!-- SPOTIFY -->

<section class="spotify-section">

  <div class="section-label">✦ &nbsp; THE SOUNDTRACK &nbsp; ✦</div>

  <div class="spotify-heading">
    <span class="eyebrow">NOW PLAYING IN MY WORLD</span>
    <h2>My Soundtrack.</h2>
    <p>songs, moods & little moments.</p>
  </div>

  <div class="spotify-frame">

    <div class="spotify-top">
      <span>MY PLAYLIST</span>
      <span>✦ 01</span>
    </div>

    <iframe
      src="https://open.spotify.com/embed/playlist/0CQjIpg3pmaO6V1lfR7wCX?utm_source=generator&theme=0"
      height="352"
      frameborder="0"
      allowfullscreen
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>

  </div>

</section>

</body>
</html>
